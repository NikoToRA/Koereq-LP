<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="医師1人から小さく始められる">
  <!-- Clean medical flat illustration (no strokes) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1FF"/>
      <stop offset="1" stop-color="#EAFBF1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect x="90" y="110" width="720" height="380" rx="72" fill="url(#bg)"/>
  <circle cx="260" cy="230" r="120" fill="#DBEAFE" opacity="0.6"/>
  <circle cx="680" cy="380" r="150" fill="#DCFCE7" opacity="0.55"/>

  <!-- doctor -->
  <g transform="translate(210 160)">
    <!-- body -->
    <rect x="120" y="170" width="260" height="240" rx="60" fill="#FFFFFF"/>
    <rect x="120" y="170" width="260" height="86" rx="60" fill="#EFF6FF"/>
    <!-- head -->
    <circle cx="250" cy="120" r="72" fill="#FAD7C4"/>
    <path d="M182 112c14-52 60-88 116-74 34 9 58 38 64 74-30 10-72 14-106 6-28-6-52-8-74-6Z" fill="#0F172A" opacity="0.82"/>
    <!-- coat shading -->
    <rect x="120" y="236" width="120" height="174" rx="46" fill="#DBEAFE" opacity="0.65"/>
    <rect x="260" y="236" width="120" height="174" rx="46" fill="#DBEAFE" opacity="0.45"/>
    <!-- stethoscope (flat) -->
    <circle cx="206" cy="270" r="18" fill="#CBD5E1"/>
    <circle cx="294" cy="270" r="18" fill="#CBD5E1"/>
    <rect x="196" y="286" width="108" height="18" rx="9" fill="#CBD5E1" opacity="0.9"/>
    <circle cx="250" cy="322" r="22" fill="#CBD5E1" opacity="0.8"/>
    <circle cx="250" cy="322" r="10" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- phone beside doctor -->
  <g transform="translate(585 210)">
    <rect x="0" y="0" width="190" height="290" rx="36" fill="#0F172A" opacity="0.92"/>
    <rect x="18" y="36" width="154" height="206" rx="26" fill="#FFFFFF"/>
    <rect x="66" y="18" width="58" height="10" rx="5" fill="#334155" opacity="0.35"/>
    <circle cx="95" cy="262" r="14" fill="#334155" opacity="0.22"/>
    <rect x="38" y="62" width="114" height="18" rx="9" fill="#EFF6FF"/>
    <rect x="38" y="90" width="86" height="16" rx="8" fill="#E5E7EB"/>
    <rect x="38" y="114" width="98" height="16" rx="8" fill="#E5E7EB"/>
  </g>

  <!-- "1" badge -->
  <g transform="translate(720 190)">
    <circle cx="48" cy="48" r="48" fill="url(#accent)"/>
    <rect x="44" y="26" width="8" height="44" rx="4" fill="#FFFFFF"/>
    <rect x="38" y="68" width="20" height="8" rx="4" fill="#FFFFFF" opacity="0.98"/>
  </g>
</svg>

