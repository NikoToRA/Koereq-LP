<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="スマホだけで簡単導入（マニュアル不要）">
  <!-- Clean medical flat illustration (no strokes) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1FF"/>
      <stop offset="1" stop-color="#EAFBF1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- soft background -->
  <rect x="90" y="110" width="720" height="380" rx="72" fill="url(#bg)"/>
  <circle cx="690" cy="220" r="110" fill="#DBEAFE" opacity="0.65"/>
  <circle cx="210" cy="380" r="140" fill="#DCFCE7" opacity="0.55"/>

  <!-- phone -->
  <g transform="translate(290 120)">
    <rect x="0" y="0" width="320" height="440" rx="52" fill="#0F172A" opacity="0.92"/>
    <rect x="24" y="44" width="272" height="344" rx="32" fill="#FFFFFF"/>
    <rect x="120" y="22" width="80" height="10" rx="5" fill="#334155" opacity="0.35"/>
    <circle cx="160" cy="410" r="18" fill="#334155" opacity="0.22"/>

    <!-- simple app UI -->
    <rect x="44" y="70" width="232" height="46" rx="16" fill="#EFF6FF"/>
    <rect x="60" y="84" width="88" height="18" rx="9" fill="#2563EB" opacity="0.55"/>
    <rect x="160" y="84" width="96" height="18" rx="9" fill="#22C55E" opacity="0.35"/>

    <rect x="44" y="134" width="232" height="20" rx="10" fill="#E5E7EB"/>
    <rect x="44" y="164" width="176" height="20" rx="10" fill="#E5E7EB"/>
    <rect x="44" y="194" width="204" height="20" rx="10" fill="#E5E7EB"/>

    <!-- QR card inside phone -->
    <rect x="88" y="238" width="144" height="144" rx="28" fill="#F8FAFC"/>
    <rect x="108" y="258" width="40" height="40" rx="12" fill="#2563EB" opacity="0.9"/>
    <rect x="184" y="258" width="40" height="40" rx="12" fill="#2563EB" opacity="0.45"/>
    <rect x="108" y="334" width="40" height="40" rx="12" fill="#22C55E" opacity="0.8"/>
    <rect x="156" y="310" width="26" height="26" rx="10" fill="#0F172A" opacity="0.10"/>
    <rect x="190" y="312" width="22" height="22" rx="9" fill="#0F172A" opacity="0.08"/>
  </g>

  <!-- check badge -->
  <g transform="translate(610 338)">
    <circle cx="72" cy="72" r="72" fill="url(#accent)"/>
    <path d="M50 74c-6-6-16-6-22 0s-6 16 0 22l18 18c6 6 16 6 22 0l56-56c6-6 6-16 0-22s-16-6-22 0L58 81Z" fill="#FFFFFF" opacity="0.98"/>
  </g>

  <!-- "no manual" chip -->
  <g transform="translate(160 168)">
    <rect x="0" y="0" width="176" height="70" rx="24" fill="#FFFFFF" opacity="0.95"/>
    <rect x="18" y="18" width="92" height="14" rx="7" fill="#E5E7EB"/>
    <rect x="18" y="40" width="120" height="12" rx="6" fill="#E5E7EB"/>
    <circle cx="144" cy="35" r="16" fill="#FEE2E2"/>
    <rect x="134" y="31" width="20" height="6" rx="3" fill="#EF4444" opacity="0.9"/>
  </g>
</svg>

