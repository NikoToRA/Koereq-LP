    <path d="M52 76c-6-6-16-6-22 0s-6 16 0 22l18 18c6 6 16 6 22 0l58-58c6-6 6-16 0-22s-16-6-22 0L58 83Z" fill="#FFFFFF" opacity="0.98"/>
