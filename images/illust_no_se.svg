    <rect x="118" y="132" width="210" height="18" rx="9" fill="#E5E7EB" opacity="0.95"/>
    <rect x="118" y="160" width="164" height="16" rx="8" fill="#E5E7EB" opacity="0.95"/>
    <circle cx="316" cy="168" r="6" fill="#22C55E" opacity="0.8"/>
  </g>

  <!-- simplified gear -->
  <g transform="translate(520 170)">
    <circle cx="150" cy="150" r="110" fill="#F1F5F9"/>
    <rect x="142" y="16" width="16" height="44" rx="8" fill="#CBD5E1"/>
    <rect x="142" y="240" width="16" height="44" rx="8" fill="#CBD5E1"/>
    <rect x="16" y="142" width="44" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="240" y="142" width="44" height="16" rx="8" fill="#CBD5E1"/>
    <rect x="56" y="56" width="38" height="16" rx="8" fill="#CBD5E1" transform="rotate(-45 75 64)"/>
    <rect x="206" y="56" width="38" height="16" rx="8" fill="#CBD5E1" transform="rotate(45 225 64)"/>
    <rect x="56" y="228" width="38" height="16" rx="8" fill="#CBD5E1" transform="rotate(45 75 236)"/>
    <rect x="206" y="228" width="38" height="16" rx="8" fill="#CBD5E1" transform="rotate(-45 225 236)"/>
    <circle cx="150" cy="150" r="54" fill="#E2E8F0"/>
