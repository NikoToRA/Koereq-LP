  </defs>

  <rect x="90" y="110" width="720" height="380" rx="72" fill="url(#bg)"/>
  <circle cx="690" cy="230" r="120" fill="#DBEAFE" opacity="0.6"/>
  <circle cx="240" cy="400" r="150" fill="#DCFCE7" opacity="0.55"/>

